# 各社のロゴをウィキメディア・コモンズから取得し、リポジトリにコミットする。
# ロゴの対応表（src/data/logo-sources.json）や取得スクリプトを変えて main 以外のブランチに push すると動く。
# Actions タブから手動実行もできる（取得済みのロゴは残し、足りない分だけ取りに行く）。
# 公開（deploy-pages.yml）はコミット済みの画像をそのまま使う。
name: Fetch company logos

on:
  push:
    branches-ignore: [main]
    paths:
      - "src/data/logo-sources.json"
      - "scripts/fetch-logos.mjs"
      - ".github/workflows/fetch-logos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-logos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ウィキメディアに待たされても1回あたり約40分で打ち切り、取得できた分をコミットする（次の実行で続きを取る）
      - name: Fetch logos from Wikimedia Commons
        run: node scripts/fetch-logos.mjs
        timeout-minutes: 50
        continue-on-error: true
        env:
          DEADLINE_MINUTES: "40"
      - name: Commit logos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/logos src/data/logos.json
          if git diff --cached --quiet; then
            echo "ロゴに変更なし"
          else
            git commit -m "ロゴ画像を取得（ウィキメディア・コモンズ）"
            # 実行中にブランチが進んでいても取り込んでから push する
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
